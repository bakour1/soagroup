<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>نموذج المشروع — SOA Group</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/base.css" />
    <link rel="stylesheet" href="../../assets/css/layout.css" />
    <link rel="stylesheet" href="../../assets/css/components.css" />
    <link rel="stylesheet" href="../../assets/css/admin.css" />
    <link rel="stylesheet" href="../../assets/css/utilities.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="nav">
        <button
          class="hamburger"
          id="menuBtn"
          aria-label="فتح القائمة"
          aria-controls="mobileDrawer"
          aria-expanded="false"
        >
          <!-- أيقونة بسيطة (3 خطوط) -->
          <span></span><span></span><span></span>
        </button>
        <ul class="nav-links">
          <li>
            <button id="logoutBtn" class="btn btn-ghost">تسجيل الخروج</button>
          </li>
          <li class="sep"></li>
          <li><a href="/index.html">الرئيسية</a></li>
          <li><a href="/goals.html">المهمات</a></li>
          <li><a href="/strategy.html">الاستراتيجية</a></li>
          <li><a href="/constitution.html">الدستور</a></li>
        </ul>
        <div class="full-brand">
          <img src="../../imgs/logo-2.png" alt="SOA Group" />
        </div>

        <!-- روابط الديسكتوب تبقى كما هي -->
      </nav>

      <!-- السلايدبار للموبايل -->
      <aside class="mobile-drawer" id="mobileDrawer" aria-hidden="true">
        <div class="drawer-header">
          <div class="full-brand">
            <img src="../../imgs/logo-2.png" alt="SOA Group" />
          </div>
          <button
            class="drawer-close"
            id="closeDrawerBtn"
            aria-label="إغلاق القائمة"
          >
            ×
          </button>
        </div>
        <ul class="drawer-links">
          <li><a href="/index.html">الرئيسية</a></li>
          <li><a href="/goals.html">الأهداف</a></li>
          <li><a href="/strategy.html">الاستراتيجية</a></li>
          <li><a href="/constitution.html">الدستور</a></li>
          <li>
            <button id="logoutBtnMobile" class="btn btn-ghost">
              تسجيل الخروج
            </button>
          </li>
        </ul>
      </aside>

      <!-- خلفية للتعتيم -->
      <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
    </header>
    <main class="container">
      <div id="app" class="app"></div>
    </main>
    <footer class="site-footer">
      <div class="full-brand">
        <img src="../../imgs/logo-3.png" alt="SOA Group" />
      </div>
      <p>© 2025 SOA Group — مجموعة سوا</p>
    </footer>

    <script src="../../assets/js/config.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/guard.js"></script>
    <script src="../../assets/js/nav.js"></script>
    <script src="../../assets/js/renderer.js"></script>
    <script type="module" src="../../assets/js/firebase-init.js"></script>
    <script>
      (function () {
        const cfg = window.SOA_CONFIG;
        const url = cfg.PAGES["model"];
        window.currentDataUrl = url;

        // 👈 مهم: مسار الوثيقة الخاصة بصفحة model
        window.FB_DOC_PATH = "soa/model";

        function boot() {
          window.SOA_RENDER.renderPage(url);
        }
        if (window.FB && window.FB.loadDoc) boot();
        else window.addEventListener("fb-ready", boot, { once: true });

        const btn = document.getElementById("logoutBtn");
        if (btn) btn.onclick = () => window.SOA_AUTH.logout();
      })();
    </script>
    <script src="../../assets/js/admin.js"></script>
  </body>
</html>
