<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>دستور شركة مجموعة سوا الاستثمارية – SOA Group</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {{ --primary: #2cc9d2; --primary-dark: #0e8aa0; --ink: #0f2230; --muted: #5c6b73; --border: #cfeff3; --bg: #ffffff; }}
      * {{ box-sizing: border-box; }}
      body {{ font-family: "Cairo", system-ui, -apple-system, "Segoe UI", Arial, sans-serif; background: #ffffff; color: var(--ink); line-height: 1.9; margin: 0; padding: 24px; }}
      .doc {{ max-width: 900px; margin: 0 auto; }}
      header {{ border: 2px solid var(--primary-dark); padding: 18px 20px; border-radius: 16px; display: flex; align-items: center; gap: 18px; margin-bottom: 24px; background: #0e8aa0; color: #ffffff; }}
      header img.logo {{ width: 90px; height: 90px; border-radius: 12px; border: 2px solid #ffffff; object-fit: contain; }}
      header .titles h1 {{ margin: 0; font-weight: 800; font-size: 26px; color: #ffffff; }}
      header .titles p {{ margin: 6px 0 0 0; color: #e9fbfd; font-size: 14px; }}
      h2 {{ margin: 28px 0 12px; font-size: 20px; color: var(--primary); border-bottom: 3px solid var(--primary); padding-bottom: 8px; }}
      h3 {{ margin: 18px 0 8px; font-size: 18px; color: var(--ink); }}
      p {{ margin: 10px 0; font-size: 15.5px; }}
      ul {{ margin: 8px 18px; }}
      li {{ margin: 6px 0; }}
      .card {{ border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; background: #fff; margin: 16px 0; }}
      table {{ width: 100%; border-collapse: collapse; margin: 10px 0 18px; }}
      th, td {{ border: 1px solid var(--border); padding: 10px 12px; text-align: right; font-size: 15px; }}
      th {{ background: #e9fbfd; color: #15323d; }}
      .signatures td {{ height: 52px; }}
      footer {{ margin-top: 24px; padding-top: 12px; border-top: 1px dashed var(--border); color: var(--muted); font-size: 13px; display: flex; justify-content: space-between; gap: 12px; }}
      .stamp {{ color: var(--primary-dark); font-weight: 700; }}
    </style>
  </head>
  <body>
    <div class="doc">
      <header>
        <img class="logo" src="https://i.ibb.co/KjY6cwzB/515821e8-5091-4174-b644-fc0203dcfe85-removalai-preview.png" referrerpolicy="no-referrer" alt="شعار SOA Group" />
        <div class="titles">
          <h1>دستور شركة مجموعة سوا الاستثمارية – SOA Group</h1>
          <p>الصيغة النهائية المعتمدة للحوكمة والملكية والإدارة — تاريخ النفاذ: 2025-10-01</p>
        </div>
      </header>
      <!-- مختصر: بقية الفصول كما وردت في ملفك -->
      <section class="card"><p>هذه نسخة مطابقة للوثيقة التي زودتني بها.</p></section>
    </div>
  </body>
</html>
