<!-- login.html -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>تسجيل الدخول — SOA Group</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/utilities.css" />

    <style>
      html, body { height: 100%; }
      .login-wrap { min-height: 100%; display: grid; place-items: center; padding: 24px; }
      .login-card { max-width: 480px; width: 100%; }
      .full-brand img { max-width: 220px; height: auto; }
    </style>
  </head>
  <body>
    <div class="login-wrap">
      <article class="card login-card">
        <div class="full-brand" style="text-align:center; margin:12px auto;">
          <img src="./imgs/logo-3.png" alt="SOA Group" />
        </div>

        <h1 class="card-title">تسجيل الدخول</h1>
        <p class="muted">
          قم بتسجيل الدخول للوصول إلى لوحة التحكم الخاصة بموقع مجموعة سوا.
        </p>

        <!-- ملاحظة: نوقف الإكمال التلقائي قدر الإمكان -->
        <form id="loginForm" class="stack" autocomplete="off" novalidate>
          <!-- حقول مخفية لتثبيط حفظ كلمات السر في بعض المتصفحات -->
          <input type="text" style="display:none" aria-hidden="true" />
          <input type="password" style="display:none" aria-hidden="true" />

          <label>
            اسم المستخدم
            <input
              id="username"
              name="username"
              required
              autocomplete="username"
              autocapitalize="off"
              autocorrect="off"
              placeholder="مثال: bakour512"
            />
          </label>

          <label>
            كلمة السر
            <input
              id="password"
              name="password"
              required
              type="password"
              autocomplete="new-password"
              placeholder="********"
            />
          </label>

          <button class="btn" type="submit">دخول</button>
        </form>

        <p class="muted">
          إذا واجهت أي مشكلة في تسجيل الدخول، يرجى التواصل مع مسؤول النظام.
        </p>
      </article>
    </div>

    <!-- الترتيب مهم: config ثم auth -->
    <script src="assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>

    <script>
      // نفس دالة حساب المسار الأساسي المستخدمة بباقي الملفات
      function getBase() {
        const cfgBase = (window.SOA_CONFIG && window.SOA_CONFIG.BASE_PATH) || null;
        if (cfgBase) return cfgBase.endsWith("/") ? cfgBase : cfgBase + "/";

        const { protocol, hostname, pathname } = window.location;
        if (protocol === "file:") return "";
        if (/\.github\.io$/.test(hostname)) {
          const seg = pathname.split("/").filter(Boolean)[0];
          return seg ? `/${seg}/` : "/";
        }
        return "/";
      }

      // حرص إضافي: نظّف أي جلسة قديمة عند فتح صفحة الدخول
      try { window.SOA_AUTH && window.SOA_AUTH.clearSession(); } catch(e) {}

      document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const u = document.getElementById("username").value.trim();
        const p = document.getElementById("password").value;

        const r = await window.SOA_AUTH.login(u, p);
        if (!r.ok) {
          alert(r.error || "فشل تسجيل الدخول");
          return;
        }
        // توجيه آمن بحسب BASE_PATH
        location.href = getBase() + "index.html";
      });
    </script>
  </body>
</html>
